[package]
name = "wist-center-stackcheck"
version = "0.5.0" #@gxl:set(version)
edition = "2024"
license = "Apache-2.0"
description = "Stack-level config checks for wist-center-stack: profile + center-specific TLS policy; engine is wist-stackcheck-core."
publish = false

[[bin]]
name = "wist-stackcheck"
path = "src/main.rs"

[dependencies]
# 本地开发用 path；发布前切成共享仓的 git rev/tag（见 README）。
wist-stackcheck-core = { git = "https://github.com/dayu-sec/wist-stack-tools.git", tag = "v0.1.0" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
