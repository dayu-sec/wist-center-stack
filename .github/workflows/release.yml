name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  # 打包：整仓内容（除 CI 自身的 .github）打成部署包。
  # 用 git archive 出包，只收 git 跟踪的内容 —— configs/（现场生成，已 ignore）、values/、_gal/.report
  # 等未入 git，天然不入包；sys/configs/*.tpl 与 sys/db/initdb/ 随仓入库，会进包。
  # 变量解析产物 sys/merged_vars.yml 是 gops 文档标注“需入库”的文件，已在仓库里、
  # 随 git archive 进包，所以这里不需要跑 gops。
  # 纪律：改了 sys/setting/vars.yml 后，本地跑一次 `gops sys update` 并把 merged_vars.yml
  # 的变更一起提交，否则包里带的是旧值。
  package:
    name: Package deployment bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Build tarball
        run: |
          set -eu
          bundle="wist-center-stack-${GITHUB_REF_NAME}"
          # 注意：**不要**加 --prefix —— gops 解包时会自建同名目录（~/ds-package/<包名>/），
          # 包内再套一层会导致 prj import 找不到 sys/sys_model.yml。
          # 变量文件 sys/merged_vars.yml 由仓库带上，不必在 CI 里现算。
          git archive \
            --format=tar \
            HEAD -- . ':(exclude).github' > "${bundle}.tar"
          gzip -9 "${bundle}.tar"
          echo "包内关键文件："
          tar -tzf "${bundle}.tar.gz" | grep -E "sys/.*vars\.yml|sys/sys_model\.yml|sys/docker-compose\.yml"
          ls -lh "${bundle}.tar.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: wist-center-stack
          path: wist-center-stack-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # 发布到 GitHub Release，供中心作为版本制品下载 / `gops prj import` 引用。
  release:
    needs: [package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wist-center-stack
          path: artifacts

      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/*.tar.gz

  # 可选：把同一制品包推到腾讯云对象存储（COS），供中心 / CDN 等按稳定 URL 拉取。
  # 未配置下方 Variables/Secrets 时整段自动跳过，不会让发布失败。
  #   仓库 Variables：COS_BUCKET（含 -APPID，如 example-1250000000）、COS_REGION（如 ap-guangzhou）、
  #                   可选 COS_PREFIX（对象键前缀，默认 wist-center-stack）
  #   仓库 Secrets：  COS_SECRET_ID、COS_SECRET_KEY（走临时密钥时再加可选 COS_SESSION_TOKEN）
  # 上传的对象键：
  #   <COS_PREFIX>/<tag>/wist-center-stack-<tag>.tar.gz   （按版本钉住，不可变）
  #   <COS_PREFIX>/latest/wist-center-stack-<tag>.tar.gz  （便于“取最新”，文件名仍带版本）
  upload-cos:
    name: Upload bundle to Tencent COS
    needs: [release]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wist-center-stack
          path: artifacts

      - name: Install coscli
        if: ${{ vars.COS_BUCKET != '' && secrets.COS_SECRET_ID != '' }}
        run: |
          set -eu
          ver="v1.0.9"
          url="https://github.com/tencentyun/coscli/releases/download/${ver}/coscli-${ver}-linux-amd64"
          curl -fsSL -o /tmp/coscli "${url}"
          mkdir -p "$HOME/.local/bin"
          install -m 0755 /tmp/coscli "$HOME/.local/bin/coscli"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/coscli" --version

      - name: Write coscli config
        if: ${{ vars.COS_BUCKET != '' && secrets.COS_SECRET_ID != '' }}
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_SESSION_TOKEN: ${{ secrets.COS_SESSION_TOKEN }}
          COS_BUCKET: ${{ vars.COS_BUCKET }}
          COS_REGION: ${{ vars.COS_REGION }}
        run: |
          set -eu
          # 明文写入 AK/SK，因此必须显式关掉 coscli 的密钥加密（disableencryption）。
          cat > "$HOME/.cos.yaml" <<EOF
          cos:
            base:
              protocol: https
              disableencryption: "true"
              secretid: "${COS_SECRET_ID}"
              secretkey: "${COS_SECRET_KEY}"
              sessiontoken: "${COS_SESSION_TOKEN}"
            buckets:
              - name: "${COS_BUCKET}"
                alias: "${COS_BUCKET}"
                region: "${COS_REGION}"
                endpoint: "cos.${COS_REGION}.myqcloud.com"
          EOF

      - name: Upload to COS
        if: ${{ vars.COS_BUCKET != '' && secrets.COS_SECRET_ID != '' }}
        env:
          COS_BUCKET: ${{ vars.COS_BUCKET }}
          COS_PREFIX: ${{ vars.COS_PREFIX }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          prefix="${COS_PREFIX:-wist-center-stack}"
          prefix="${prefix%/}"
          file="artifacts/wist-center-stack-${TAG}.tar.gz"
          test -f "${file}"
          cfg="$HOME/.cos.yaml"
          coscli cp "${file}" "cos://${COS_BUCKET}/${prefix}/${TAG}/wist-center-stack-${TAG}.tar.gz" -c "${cfg}"
          coscli cp "${file}" "cos://${COS_BUCKET}/${prefix}/latest/wist-center-stack-${TAG}.tar.gz" -c "${cfg}"
          echo "COS 上传完成，当前前缀内容："
          coscli ls "cos://${COS_BUCKET}/${prefix}/" -c "${cfg}"
