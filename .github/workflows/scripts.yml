name: Scripts

on:
  push:
    branches: [main, beta, alpha]
    paths: ["scripts/**", "dev/**", "sys/**", ".github/workflows/scripts.yml"]
  pull_request:
    paths: ["scripts/**", "dev/**", "sys/**", ".github/workflows/scripts.yml"]

permissions:
  contents: read

# 只做**仓库自己的事实**：脚本能不能过静态检查。
#
# 安装链路 e2e（`dev/e2e-install.sh`）**故意不在这里跑**：它要一个真实中心的地址、
# 管理面地址和 admin token，还要往那个中心的登记表/网关列表里动东西 —— 那些是**部署态信息**，
# 不是仓库的属性。而且中心会部署多个实例、各有一份登记表和自己的运营，仓库 CI 没有立场
# 代表其中任何一个。所以 e2e 由运维/发布在目标环境上手动跑：
#
#   dev/e2e-install.sh --center <网关面地址> --admin <管理面地址> \
#       --token-from-gops <中心栈目录>        # 在中心机上跑，从密钥文件取 token，不落盘
jobs:
  shellcheck:
    name: Shellcheck scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Ensure shellcheck
        run: command -v shellcheck >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y shellcheck)
      - run: ./dev/lint.sh

  # 脚本回归（`dev/tests/*.test.sh`）：与网关栈同一口径 —— 必须有 macOS 那一路，
  # bash 3.2 / LibreSSL / 默认 umask 的差异只在那里能复现。
  shell-tests:
    name: Shell regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v7
      - name: Run dev/tests
        run: |
          set -eu
          fail=0
          for t in dev/tests/*.test.sh; do
            echo "::group::${t}"
            if bash "${t}"; then echo "PASS ${t}"; else echo "::error file=${t}::${t} 失败"; fail=1; fi
            echo "::endgroup::"
          done
          exit "${fail}"
