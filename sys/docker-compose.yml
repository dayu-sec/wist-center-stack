# wist-center-stack — 中心后端(wist-center) + 管理前端(wist-center-web) + 观测 一站式编排
#
# 端口约定（宿主:容器；宿主端口的值见 sys/setting/vars.yml，现场在 values/value.yml 覆盖）：
#   center           ${CENTER_PORT}:3100   中心后端 HTTPS+mTLS API（默认 3100；服务端证书 + 校网关客户端证书）
#   web              ${WEB_PORT}:443       前端入口（nginx **终止 TLS** + 静态 + /api 反代；默认 18080）
#   postgres         ${PG_PORT}:5432       中心存储 PgStore（默认 55432）
#   victoria-metrics ${VM_PORT}:8428       指标/历史时序（默认 28429）
#   db-schema        无端口               一次性：每次 start 幂等套一遍 sys/db/initdb/01_schema.sql
#                                          （center 等它成功才起；见该服务注释）
#
# 容器内端口是**应用契约**，写死（3100/443/5432/8428）；宿主端口才是变量 —— 两边不要写混。
#
# 值来源（gops 系统约定）：
#   - 随环境/客户变化的量（镜像源与 tag、宿主端口、域名、挂载路径）统一用 Compose 原生 `${VAR}`
#     占位，定义在 sys/setting/vars.yml；`gops sys update` → sys/merged_vars.yml，
#     `gops sys localize` → 栈根 .env。现场覆盖写 values/value.yml（该文件版本化）。
#   - 密钥（admin token / hmac secret）走栈根 `.wist/sec-value.yml`（密钥文件，只读挂进
#     center 容器），配置里只留 `${SEC_xxx}` 占位、不落盘；键：center_admin_token / center_hmac_secret。
#     其它密钥如需，仍可用 `${SEC_xxx}` 占位、由 `gops run start` 注入、不落盘。
#   - 容器内端口/路径/服务名是应用契约，直接写在这里。
#
# 与 wist-center 自带 docker-compose.yml 的关系：那份只含第三/依赖（postgres + victoriametrics），
# 供中心源码开发用；本份是**发布态**整栈编排（含 center/web），起停走 `gops run`。
#
# 单实例保障：四个服务都钉**固定 `container_name`**（不是 compose 默认的 `<项目>-<服务>-1`）。
# 为什么必须钉：默认名里带项目名，而项目名默认取目录名 —— 两份同名目录的栈会共用同一批容器名，
# 第二个 `up` 不会报错，而是**悄悄接管/顶掉**第一个的容器。钉死后第二个栈的 `up` 会当场报名字冲突。

services:
  # ── 中心存储：PostgreSQL（PgStore）──
  #
  # 表结构由 ${PG_INITDB_DIR}/01_schema.sql 在**首次**初始化数据卷时建立
  # （docker-entrypoint-initdb.d 只在空 data 目录时执行）。库里是网关注册表 / 凭据 / 状态快照。
  # 说明：库结构与 `wist-center/docker/initdb/01_schema.sql` 同源，改中心 schema 时两处要同步。
  postgres:
    container_name: wist-center-stack-postgres
    image: postgres:${PG_TAG}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
      TZ: ${TZ}
    ports:
      - "${PG_PORT}:5432"
    volumes:
      - postgres16-data:/var/lib/postgresql/data
      - ${PG_INITDB_DIR}:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ── 库结构应用（一次性）：让**既有数据卷**也能拿到 schema 新增列 ──
  #
  # 为什么需要：`docker-entrypoint-initdb.d` **只在空 data 卷首次初始化时**执行，之后
  # `sys/db/initdb/01_schema.sql` 的改动（新增列）根本到不了已有库 —— 中心会因写不出的列报 SQL 错。
  # 该文件全是 `CREATE/ALTER … IF NOT EXISTS`（幂等），所以每次 start 都套一遍是安全的。
  # `center` 依赖它 `service_completed_successfully`：schema 应用失败就不让中心带旧表结构起来。
  db-schema:
    container_name: wist-center-stack-db-schema
    image: postgres:${PG_TAG}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${PG_USER}
      PGPASSWORD: ${PG_PASSWORD}
      PGDATABASE: ${PG_DB}
    volumes:
      - ${PG_INITDB_DIR}:/schema:ro
    entrypoint:
      - psql
      - -v
      - ON_ERROR_STOP=1
      - -q
      - -f
      - /schema/01_schema.sql

  # ── 观测：指标/历史时序 ──
  victoria-metrics:
    container_name: wist-center-stack-vm
    image: victoriametrics/victoria-metrics:${VM_TAG}
    restart: unless-stopped
    ports:
      - "${VM_PORT}:8428"
    volumes:
      - metrics_data:/storage
    command:
      - --envflag.enable
      - --envflag.prefix=VM_
      - --loggerFormat=json
      - --retentionPeriod=${RETENTION_PERIOD}
      - --storageDataPath=/storage
      - --search.latencyOffset=0s
    environment:
      - TZ=${TZ}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8428/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── 控制中心后端 ──
  #
  # 配置与密钥**卷挂载注入**，不烘焙进镜像：${CENTER_CONFIG_DIR}（渲染出的 wist-center.toml + state/logs）
  # 挂到容器 /wist-center，容器内 WIST_CENTER_CONFIG 指向它。
  # 站点身份（CA / 服务器证书 / 私钥）**不在 configs/ 里**：它在栈根 `identity/center/`（dev/prod 共用、
  # 整体作对外契约），只读挂到容器 /wist-center/ca（模板 ca_cert_path 指向 /wist-center/ca/control-center.pem）。
  # 密钥（admin token / hmac secret）不落配置：配置里写 `${SEC_*}`，由 WIST_CENTER_SEC_FILE
  # 指向的密钥文件（./.wist/sec-value.yml）解析。
  # 制品镜像**另挂** ${CENTER_ARTIFACT_DIR} → /wist-center/artifacts（模板里 dir = "artifacts"）：
  # 与 configs/ 分开（一个是密钥、一个是可重拉数据），备份分级互不牵连。
  # 容器内 listen_addr 由模板写成 0.0.0.0:3100（代码默认 127.0.0.1:3100，端口映射不进来）。
  # 中心**开服务端 TLS，并校网关客户端证书（mTLS）**：网关直连 3100，靠客户端证书认人
  #（客户端证书**可选** —— 首注册的网关还没有证书；无证书不等于未鉴权，应用层再判）。
  # 管理面浏览器走 web 容器的 TLS 终止（见下）；web → center 这一跳也走 https。
  # 运行身份 999:999（镜像里 `useradd -r wist`），宿主侧由 scripts/align-host-perms.sh 对齐。
  center:
    container_name: wist-center-stack-center
    image: ${IMAGE_SPC}/wist-center:${CENTER_TAG}
    user: "999:999"
    restart: unless-stopped
    environment:
      WIST_CENTER_CONFIG: /wist-center/wist-center.toml
      # 站点事实（现场态）：与主配置**分文件** —— 声明（只写 `${VAR}`，可重渲）+ 同目录 `.env`（值，永不重渲）。
      # 声明在身份目录里（挂到 /wist-center/ca），不在主配置同目录，所以**显式指定**；
      # 值 `.env` 挨着声明（/wist-center/ca/.env），按约定自动解析，无需另设。
      WIST_CENTER_PUB_CONFIG: /wist-center/ca/wist-center-pub.toml
      # admin_token / hmac_secret 从密钥文件读（不落配置）：模板里写 `${SEC_CENTER_*}`。
      WIST_CENTER_SEC_FILE: /secrets/sec-value.yml
      # 服务端 TLS 证书/私钥：**成对**配才起 HTTPS（中心用它对外；网关的 trust_bundle = 签它的 CA-S）。
      # 都在只读挂入的 /wist-center/ca（= 站点身份 identity/center/）。
      # 网关客户端 CA（CA-G）不用另设：中心默认取同目录的 gateway-client-ca.{pem,key.pem}。
      WARP_INSIGHT_CENTER_SERVER_CERT_PATH: /wist-center/ca/control-center-server.crt
      WARP_INSIGHT_CENTER_SERVER_KEY_PATH: /wist-center/ca/control-center-server.key
    volumes:
      - ${CENTER_CONFIG_DIR}:/wist-center
      # 站点身份（dev/prod 共用，只读）：CA 证书 / 服务器证书 / 私钥 + 现场态 wist-center-pub.toml。
      # 从资源树（configs/）拆出（见 sys-prj.yml 的 contract / backup）—— 不可重建，
      # 不该跟渲染物一起被升级覆盖；容器只需读其中的 CA 证书（ca_cert_path）与现场态站点事实，故整目录只读挂入。
      - ./identity/center:/wist-center/ca:ro
      # 密钥目录（只读）：中心用 WIST_CENTER_SEC_FILE 读里面的 `sec-value.yml` 解析 `${SEC_*}`。
      # 挂**目录**而非文件：源缺失时 Docker 只是建出 `.wist/` 目录（本就 gitignore），
      # 不会把 `sec-value.yml` 建成同名目录让报错变得难懂。文件由 scripts/init-center.sh 生成。
      - ./.wist:/secrets:ro
      - ${CENTER_ARTIFACT_DIR}:/wist-center/artifacts
    ports:
      - "${CENTER_PORT}:3100"
    depends_on:
      postgres:
        condition: service_healthy
      db-schema:
        condition: service_completed_successfully
      victoria-metrics:
        condition: service_healthy

  # ── 前端（nginx：**终止 TLS** + 静态托管 + /api 反代到 center）──
  #
  # 镜像内**不含**站点配置（与 wist-gateway-web 同构）：由 sys/configs/web/nginx.conf.tpl 渲染出
  # configs/web/nginx.conf 后挂到 /etc/nginx/conf.d/default.conf。
  # 本页 nginx 在容器内 **443** 上跑 **HTTPS**：服务器证书只读挂载自站点身份
  # `identity/center/control-center-server.{crt,key}`（由站点 CA 签、SAN 覆盖对外域名），宿主发布到 ${WEB_PORT}。
  # `/api` 反代到 center 容器 3100（容器网络内明文 —— 中心自身不做 TLS）。
  web:
    container_name: wist-center-stack-web
    image: ${IMAGE_SPC}/wist-center-web:${WEB_TAG}
    restart: unless-stopped
    volumes:
      - ${WEB_NGINX_CONF}:/etc/nginx/conf.d/default.conf:ro
      # 站点服务器证书/私钥（只读）：容器内 443 终止 TLS 用。SAN 覆盖对外域名，由 scripts/init-center.sh 备齐。
      - ./identity/center/control-center-server.crt:/certs/server.crt:ro
      - ./identity/center/control-center-server.key:/certs/server.key:ro
    ports:
      - "${WEB_PORT}:443"
    depends_on:
      - center

volumes:
  postgres16-data:
    driver: local
  metrics_data:
    driver: local
