# 系统级变量定义（system 段，仅非密钥配置）—— **产品默认值**
#
# ⚠ 现场值不要写在这里：写 ops-prj 的 `values/<系统名>/sys_value.yml`（它覆盖本文件，`gops sys localize` 即生效）。
#    改**本文件**才需要 `gops sys update`（并把 `sys/merged_vars.yml` 一起提交），否则不生效。
#
# 链路：本文件 → `gops sys update` → `sys/merged_vars.yml`（入库）
#       → `gops sys localize`（+ 合并 values/ 覆盖）→ 栈根 `.env` + `sys/configs/*.tpl` 渲染结果，
#       供 `sys/docker-compose.yml` 与 `scripts/*` 消费。
#
# 说明：
#   - 只有 `system:` 段的变量会进入 resolved_vars.yml 并最终导出到 .env；
#   - 密钥不要写在这里：
#       · center admin token / hmac secret / DB app 密码 / Git 读写 token → 栈根 `.wist/sec-value.yml`；
#       · 由 scripts/init-*.sh 生成/读取，再写进配置或 `*.env`（compose env_file）；
#       · compose 里仍可用 `${SEC_xxx}` 占位，由 `gops run start` 注入。
#   - 容器内端口/路径/服务名是应用契约，直接写在 sys/docker-compose.yml 里。
system:
  # 镜像源前缀（每个镜像独立，可分别指向不同 registry；内网/镜像源可逐项覆盖）：
  #   CENTER_REGISTRY      中心后端 + 前端（wist-center / wist-center-web）
  #   VM_REGISTRY          VictoriaMetrics（观测）
  #   PG_REGISTRY          PostgreSQL（中心存储）
  #   GIT_PROXY_REGISTRY   Center Git Proxy（nginx）
  - name: CENTER_REGISTRY
    value: ghcr.io/dayu-sec

  - name: VM_REGISTRY
    value: quay.io/victoriametrics

  - name: PG_REGISTRY
    value: docker.io/library

  - name: GIT_PROXY_REGISTRY
    value: docker.io/library

  # 镜像 tag（钉的是**镜像版本**，与 git tag 无关；中心后端与前端各自独立发版）：
  #   CENTER_IMAGE_TAG       wist-center 的 release tag
  #   CENTER_WEB_IMAGE_TAG   wist-center-web 的 release tag
  - name: CENTER_IMAGE_TAG
    value: v0.24.1-alpha
  - name: CENTER_WEB_IMAGE_TAG
    value: v0.21.0-alpha
  # 观测镜像 tag（源前缀见 VM_REGISTRY）
  - name: VM_IMAGE_TAG
    value: v1.154.0

  # Git Proxy 镜像（官方 nginx；固定小版本，定期跟随安全更新）。
  - name: GIT_PROXY_IMAGE_TAG
    value: 1.27-alpine

  # 中心生成「网关安装命令」时用的网关镜像（写进渲染出的 wist-center.toml 的 [artifacts] gateway_image）。
  # 现场按实际网关栈镜像覆盖；默认值与 wist-gateway-stack 当前钉的版本对齐。
  - name: GATEWAY_IMAGE
    value: ghcr.io/dayu-sec/wist-gateway:v0.27.0-alpha
  # 网关部署工程（ops-prj）**模板仓库**：中心生成的 `install-all` 脚本 clone 它来落工程
  # （替代早先的 `gops prj new`）。工程自带 ops-prj.yml 与 values/wist-gateway-stack/sys_value.yml。
  # 写进渲染出的 wist-center.toml 的 [artifacts] gateway_project_repo；
  # 现场换仓库时在 ops-prj 的 values/<系统名>/sys_value.yml 覆盖本项，再 `gops sys localize`。
  # 需 wist-center ≥ 0.25.0-alpha（旧中心不认该键，仍用内置默认地址）。
  - name: GATEWAY_PRJ_TPL_REPO
    value: https://wgc-git.beta.jingang.cloud/gateway-tx.git
  # 中心存储：PostgreSQL（PgStore）。库结构由 sys/db/initdb/01_schema.sql 在**首次**初始化数据卷时建立。
  - name: PG_IMAGE_TAG
    value: '16'

  # 宿主端口（容器内端口是应用契约，写在 compose 里）。
  #
  # **面分离**（公网 / 内网）——`*_BIND_IP` 控制“绑哪张网卡”：
  #   · **公网只开两个**：`CENTER_API_HOST_PORT`（网关面 `/api/v1/gateway/**`，mTLS）
  #     与 `GIT_PROXY_HOST_PORT`（Gateway 拉 CNB 仓库）；
  #   · 其余全部绑 `127.0.0.1`：管理面、Web UI、PG、VM。
  #   内网开放时把对应的 `*_BIND_IP` 改成内网网卡 IP；**不要**把管理面/数据库改成 0.0.0.0。
  - name: CENTER_API_BIND_IP
    value: 0.0.0.0        # 网关面：对外
  - name: CENTER_API_HOST_PORT
    value: 3100
  # 管理面：**独立 listener**（只挂 `/api/v1/admin/**` + `/api/v1/version`）。
  # 浏览器经 web 容器的 nginx 反代访问，宿主机默认只绑回环。
  - name: CENTER_ADMIN_BIND_IP
    value: 127.0.0.1
  - name: CENTER_ADMIN_HOST_PORT
    value: 3102
  # 中心前端入口（nginx 终止 TLS + 静态 + /api 反代到中心）。
  # 本机默认 2443；8443 留给 wist-gateway-stack 的 web，避免两栈同机冲突。
  - name: WEB_BIND_IP
    value: 127.0.0.1
  - name: WEB_HOST_PORT
    value: 2443
  - name: PG_BIND_IP
    value: 127.0.0.1
  - name: PG_HOST_PORT
    value: 55432
  - name: VM_BIND_IP
    value: 127.0.0.1
  - name: VM_HOST_PORT
    value: 28429
  # Center Git Proxy：Gateway 的 wparse 从这里拉取 CNB 仓库。
  # **必须对 Gateway 主机可达** → 属于公网面（与 CENTER_API_HOST_PORT 同级）。
  #
  # 双 IP（可选）：让 Git Proxy 也能用 443、而网关侧地址不带端口 ——
  # 靠的就是这两个变量的**一对**，不需要新变量：
  #   CENTER_API_BIND_IP    = 主私网 IP（如 10.168.0.149），CENTER_API_HOST_PORT    = 443
  #   GIT_PROXY_BIND_IP = 第二/辅助私网 IP（如 10.168.0.150），GIT_PROXY_HOST_PORT = 443
  # 要点：
  #   · 云上公网 IP 是 NAT → 绑**私网** IP；绑 EIP 会 `bind: cannot assign requested address`；
  #   · 两端口相同时，两个 BIND_IP 必須**不同且不能是 0.0.0.0**，否则 EADDRINUSE；
  #     localize 里的 init-git-proxy-conf.sh 会提前拦住并给出两种出路；
  #   · 换 IP/域名后网关侧要同步改 `WPARSE_PROJECT_*_REPO`（见仓根 TODO.md P1）。
  - name: GIT_PROXY_BIND_IP
    value: 0.0.0.0
  - name: GIT_PROXY_HOST_PORT
    value: 18082
  # Git Proxy 的**对外域名**（Gateway 侧看到的地址；也是服务器证书 SAN 要覆盖的名字）。
  # 留空 = 沿用 `API_WGC_DOMAIN`（过渡态：`https://<API_WGC_DOMAIN>:<GIT_PROXY_HOST_PORT>/<repo>`）。
  # 定成 `wp-git.<zone>` + 主机第二公网 IP 的 443 之后，网关侧地址就不带端口了（见仓根 TODO.md P1）。
  - name: GIT_PROXY_DOMAIN
    value: ''
  # 双向证书（mTLS）：名字/取值与 nginx `ssl_verify_client` 一一对应（不额外发明一套枚举）：
  #   off      默认，只验服务端证书（与旧行为一致）
  #   optional 灰度：验链但放行，只把结果记进日志（`verify=$ssl_client_verify`）
  #   on       强制：客户端必须持 CA-G（identity/center/gateway-client-ca.pem）签发的证书
  # 客户端证书与中心网关面（:3100）是**同一套 per-gateway 身份**（URI SAN = gateway_id）。
  - name: GIT_PROXY_CLIENT_CERT_VERIFY
    value: off
  # Center wparse-proxy：wparse 管理面的兼容入口（**管理面，内网**）。
  # 同栈调用方走 docker 网络，不需要宿主端口；远程调用方请绑内网 NIC。
  - name: WPARSE_PROXY_BIND_IP
    value: 127.0.0.1
  - name: WPARSE_PROXY_HOST_PORT
    value: 18083

  # 指标保留期（月）与时区
  - name: VM_RETENTION_MONTHS
    value: 6
  - name: TZ
    value: Asia/Shanghai

  # **两个域名，两个面**（证书 SAN 会同时包含它们）：
  #   WEB_WGC_DOMAIN     管理面 / Web UI（浏览器；nginx 终止 TLS）
  #   API_WGC_DOMAIN 网关面（gwlinkd 直连 3100，mTLS）+ Gateway 拉仓库的 Git Proxy
  # 留空 = 派生 `api.<WEB_WGC_DOMAIN>`。域名必须能解析到本机，且在服务器证书 SAN 内。
  # —— 只是**默认值**；现场值走 ops-prj 的 values/<系统名>/sys_value.yml（改那里 localize 即生效）。
  - name: WEB_WGC_DOMAIN
    value: center.example.com
  - name: API_WGC_DOMAIN
    value: ''

  # 中心存储 PostgreSQL（容器网络内服务名 postgres）。
  # PG_SUPERUSER / PG_SUPERUSER_PASSWORD 是 **bootstrap superuser**，只用于建库/迁移/备份，不用于应用。
  # app 账号在 scripts/init-*.sh 里生成：center_app。
  - name: PG_SUPERUSER
    value: demo
  - name: PG_SUPERUSER_PASSWORD
    value: demo
  - name: PG_DB
    value: insight_demo

  # 外部 Git 仓库（私有，已存在）。Center 的规则发布入口与 Git Proxy 共用。
  #
  # **产品默认值为空：模板不绑定任何客户 / 仓库地址**（示例见 README「变量与本地化」）。
  # 两项都留空时中心照常启动，但：
  #   · 规则 / 配置发布入口关闭（`[wparse_release] enabled = false`，发布页没有 ④/⑤）；
  #   · Git Proxy 白名单为空 → 拒绝一切 git 请求（网关 `project_remote` 拉不到规则）；
  #   · 中心仍可正常做包发布 / 网关管理。
  # 要这两项能力时，在 ops-prj 的 `values/<系统名>/sys_value.yml` 里覆盖：
  #   WP_RULES_REPO_URL: https://<git-host>/<组>/<项目>/wp-rules
  #   WP_INFRA_REPO_URL: https://<git-host>/<组>/<项目>/wp-infra
  #
  #   WP_RULES_REPO_URL / WP_INFRA_REPO_URL：预克隆与 push 的远端（必须同主机）；
  #   WP_GIT_BASE_URL：[gitea] base_url 占位；留空 = 从两个 repo URL 推导；
  #   WP_GIT_PUSH_USER / WP_GIT_PUB_USER：写/读账号（可被 .wist 的 wp_git_*_user 覆盖）；
  #   token 不放这里：.wist/sec-value.yml 的 wp_git_push_token / wp_git_pub_token。
  - name: WP_RULES_REPO_URL
    value: ''
  - name: WP_INFRA_REPO_URL
    value: ''
  - name: WP_GIT_BASE_URL
    value: ''
  - name: WP_GIT_PUSH_USER
    value: ''
  - name: WP_GIT_PUB_USER
    value: ''

  # 外部 Git 上游的鉴权 header（默认 Basic Authorization；Bearer/自定义时改名字）。
  - name: WP_GIT_AUTH_HEADER
    value: Authorization
  # 可选：Git Proxy 的客户端 IP allowlist（CIDR，逗号分隔；空 = 放开）。
  # 上线前建议至少填 Gateway 主机网段。
  - name: GIT_PROXY_ALLOW_CIDR
    value: ''

  # 短路径别名：Git Proxy 自动补上的上游目录前缀，Gateway 侧就能只写 `/wp-infra`。
  #   留空 = 自动取两个仓库 URL 的**公共上级目录**（`.../<组>/<项目>/wp-*`
  #   → `<组>/<项目>`）；`off` = 不生成别名（只认完整路径）；
  #   也可显式写一个前缀（必须同时是两个仓库的前缀）。
  - name: GIT_PROXY_SHORT_PREFIX
    value: ''

  # Gateway 侧 wparse 的 Git 拉取基址（写进网关对接片段）。
  # **Gateway 主机视角**：留空 = 自动取 `https://<GIT_PROXY_DOMAIN 或 API_WGC_DOMAIN>:<GIT_PROXY_HOST_PORT>`；
  # 端口为 443 时网关侧应写成不带端口的 `https://<GIT_PROXY_DOMAIN>`。
  # 如果 Gateway 走另一条网络/域名访问 Center，再在 values/ 里显式覆盖。
  - name: GIT_PROXY_PUBLIC_BASE
    value: ''

  # 中心查询/推送时序库的地址（容器内服务名 victoria-metrics）。
  - name: VICTORIA_METRICS_URL
    value: http://victoria-metrics:8428

  # 挂载源路径（按部署环境摆放）
  - name: CENTER_CONFIG_DIR
    value: ./configs/center
  - name: CENTER_ARTIFACT_DIR
    value: ./artifacts
  # Git Proxy 配置目录（nginx.conf 渲染物）。
  - name: GIT_PROXY_CONFIG_DIR
    value: ./configs/git-proxy
  # 前端站点配置：由 sys/configs/web/nginx.conf.tpl 在 localize 时渲染到此（运行物，不入库）
  - name: WEB_NGINX_CONF
    value: ./configs/web/nginx.conf
  # PostgreSQL 建表脚本目录（随库入库；首次初始化数据卷时执行）
  - name: PG_INITDB_DIR
    value: ./sys/db/initdb
