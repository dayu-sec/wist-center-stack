test_envs:
  dep_root: ''
  deps: []

# 宿主 bind 挂载权限（`gops sys perms`，gops ≥ 2.7；per-service 覆盖需 ≥ 2.9）：
#   缺省 = 从 compose 派生（服务 `user:` + `volumes.read_only`），不需要配置。
#   需要显式声明的三种现场：
#     · rootless / userns-remap（容器 uid ↔ 宿主 uid 不等价）→ container_uid/gid
#     · 镜像默认 root、入口脚本降权（如 postgres → 999 后才读 initdb.d）→ services
#     · bind source 在系统根之外 → allow_external
#
# 以 root 运行的服务会被跳过（root 不受宿主模式限制；`Config.User` 为空 = root）。
# 本栈给 postgres 声明有效身份，让 `sys/db/initdb` 按 999 对齐（否则它会被当作 root 跳过）。
perms:
  services:
    postgres:
      uid: 999
      gid: 999
#   container_uid: 100999     # rootless / userns-remap 的宿主映射（必须与 gid 同时给）
#   container_gid: 100999
#   allow_external:           # 允许对齐系统根之外的 bind source
#     - /srv/shared/packages

# `gops sys package` 打包时排除的路径（glob，相对系统根；默认模式与 `--full` **都生效**）。
#
# 资源树（`configs/`、`artifacts/`、`.wist/`）里是**可重建 / 每部署一份**的东西：渲染出的
# `wist-center.toml`、JSON store、制品镜像、密钥文件。它们随包走没有意义，密钥更是**绝不能**进包。
#
# **站点身份**（CA / 服务器证书 / 私钥）**不在资源树里** —— 它是**站点级、dev/prod 共用**的唯一一份，
# 放栈根 `identity/`，并整体作为**对外契约**声明（见下面 `contract:`）。身份是「证书 + 私钥」一对，
# 拆开就不自足（丢私钥 = 签不出新叶 / 客户端证书 = 换锚），所以**整目录进 contract**。
ignore:
  - configs
  - artifacts
  # 开发态运行物（`dev/svc.sh` 生成：本地 JSON store / pid / 渲染出的配置与 TLS 材料）——
  # 与 `configs` 同一个理由：每部署一份、可重建，不进交付包。
  - dev/configs
  # 栈根现场密钥目录（`WIST_CENTER_SEC_FILE` 默认指向 `.wist/sec-value.yml`：center admin token /
  # hmac secret）。与 `configs` 同一个理由 —— 密钥绝不进交付包；默认模式靠 `.gitignore` 挡住，
  # 这条是 **`--full` 模式的护栏**（WalkDir 不读 `.gitignore`）。
  - .wist

# 现场态：升级/重建时**不覆盖、也不删**的路径（glob，相对系统根）。
#
# 不变式 `ignore ⊆ protect`：不进交付包的按定义就不是包内容，升级当然也不该碰它。
# （gops 2.3 起键名为 `protect`；旧名 `preserve` 仍可读，这里统一用新名。）
# `contract:`（下方）声明即**自动纳入保护**，不必在这里再写一遍。
protect:
  - .env
  - configs
  - artifacts
  # 开发态运行物：升级/重建同样不能覆盖（与 `ignore` 保持一致）。
  - dev/configs
  # 跟 `ignore` 保持一致（不变式 `ignore ⊆ protect`）。
  - .wist

# 对外契约：**不可重建的公开现场事实** —— 本栈把它定为**整个站点身份**（自足）。
#
# `identity/center/`（dev/prod 共用）里：
#   control-center.pem           # CA 证书 = 分发给所有网关的信任根（换它 = 换公章，已分发的全部失效，
#                                #   每个网关都要重发）
#   control-center-ca.key        # CA 私钥（**务必备份**）
#   control-center-server.crt    # 中心 TLS 服务器证书（由 CA 签；给前面的反代用，中心容器自身不做 TLS）
#   control-center-server.key    # 中心服务器私钥
#   control-center.srl           # CA 序列号（宿主 openssl 续签要写）
#
# **为什么含私钥**：身份是「证书 + 私钥」一对，只留公开半不自足 —— 丢了 CA 私钥就签不出新的
# 服务器 / 客户端证书（= 换锚、所有网关重发信任根），契约等于冻结 / 作废。故整目录进 contract，
# 让 `contract export` 出来的归档即可**独立复原站点身份**。
#
# 语义：命中即 **不覆盖（protect）+ 不进包**，不必再写进上面 `ignore` / `protect` 两节。
# ⚠ **备份要单独做**：`gops prj backup` **只收下面 `backup:` 表**，不含 `contract`（实测：本栈
#   的 `prj backup` 产物只有 `configs/` + `.wist/`）。站点身份的唯一备份通路是显式导出：
#     gops prj contract export     # → <ops-prj.yml: contract.target>/<prj>-contract-<时间戳>.tar.gz
#   部署 / 升级 / 域名变更后都跑一次。⚠ 归档含 CA / 服务器 / 网关客户端 CA 私钥，是**密件**：
#   落点（`ops-prj.yml: contract.target`）要**安全且离机**，与整站备份同等级别对待；gops 产出的
#   文件默认 0644，交付后自行收紧（如 `chmod 600`）。
# ⚠ 已知（gops 2.3.0）：`sys package` **尚未把 `contract` 计入排除**，故 `--full` 下 `identity/` 仍可能进包；
#   发布走 `.github` 的 `git archive` + `.gitignore`（含 `/identity/`），不受影响 —— 待 gops 修复后再靠 `--full`。
contract:
  - identity

# 备份选取（**扁平列表**：只表达“丢了什么代价”，**不触发任何删除**）。
# 列进来的都是站点**不可再生 / 需原样回放**的材料：`configs/`（渲染出的 `wist-center.toml`、
# JSON store、logs、`configs/git-proxy/`）
# 与密钥文件 `.wist/sec-value.yml`（admin token / hmac secret / app DB 密码 / CNB token）。注意：`wist-center.toml` 里只有 `${SEC_CENTER_*}` **占位**
# （真值不落盘），所以归档**必须**带上 `.wist`，否则还原后重新生成会换掉 token / hmac
# （已注册网关的派生凭据全失效）。
#   注意：PostgreSQL 数据卷（pg 里的 store）与 VictoriaMetrics 时序**不在文件备份范围内** ——
#   库丢了，网关凭现存的客户端证书会重连重建；时序本就是历史。要备库得单独 `pg_dump`。
# 制品镜像（`artifacts/`）是**可重建**的（从 release 来源地址镜像来的，丢了可重新录入）—— 故**不进本表**。
#
# gops 2.3 起 `backup:` 是**扁平列表**（旧的分档 `{restore, rebuild}` 形式已取消）：
# 列进来的都会被 `gops prj backup` 收走。
# ⚠ 站点身份（`identity/`）**不在本表、也不会被自动收进 `prj backup`** —— `backup` 与 `contract`
#   是两条互不合并的通路（实测本栈 `prj backup` 只产 `configs/` + `.wist/`）。身份走
#   `gops prj contract export`（见上）。
#   也**不要**把它写进本表：同一路径既在 `contract` 又在 `backup` 会触发 `contract.overlap`
#   （诊断当声明错误报出）。
backup:
  - configs
  - .wist

# 密钥文件：`gops run` / `gops sec` 运行时从这里加载 `SEC_*` 环境变量（值不落配置、不进包）。
#
# 只指路、不含值：
#   · 变量名由 orion-sec 归一化——`center_admin_token` → `SEC_CENTER_ADMIN_TOKEN`
#     （大写 + `SEC_` 前缀，已带前缀不重复加），与 `sys/configs/**.tpl` 的 `${SEC_*}` 占位天然对齐；
#   · 路径必须**相对系统根**，不接受绝对路径 / `..` / 符号链接；声明了就必须存在；
#   · 文件模式由 `secrets.mode` 决定：`0600`（默认，只属主可读）/ `0640`（属组 = 容器 gid）。
#     需要 gops ≥ 2.9；2.8 的 `secrets` 节会拒绝 `mode` 字段。
secrets:
  file: .wist/sec-value.yml
  # 与容器共享靠**属组**，不靠改属主：部署账号:容器 gid(999) 0640。
  # 部署账号按 owner 读、center 按 group 读；gops 不做 chown 到容器 uid、不提权。
  # 一次性前置（管理员）：部署账号加入 gid 999（`usermod -aG`），`.wist` 用 setgid 继承该组。
  mode: "0640"
  # 注入范围（最小权限）：键名模式，只支持 `*`，匹配归一化后的 `SEC_*` 名。
  #   run / sec 缺省 = all；localize 缺省 = none（必须显式开）。
  # 这里先声明 localize 的范围；`gops sys localize` 接入 SEC_* 注入后即生效。
  expose:
    run: all
    localize:
      - SEC_CENTER_*
